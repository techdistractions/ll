; LiteLink example. Edit all addresses and the NIC base for your LAN.
[NETWORK]
NIC=PICOMEM
NICBASE=320
IRQ=3
MACFORMAT=PACKED
IP=192.168.0.20
NETMASK=255.255.255.0
GATEWAY=192.168.0.1
DNS=192.168.0.1
TIMEOUT=60
RETRIES=2
RETRYDELAY=3
BLOCKSIZE=256
[SHELL]
MODE=MANAGER
HOST=192.168.0.10
PORT=21210
ROOT=FILES
REQUEST=
[EXECUTION]
ALLOWRUN=OFF
JOBMEM=OFF
[TIME]
SERVER=time.cloudflare.com
PORT=123
; UTC by default. Set your current local offset in signed minutes before /SET.
UTCOFFSET=0
[GET]
MAXKB=16384

; Optional LLFS mapped drive; used only by LLFS.EXE on actual DOS 3.30.
; Choose a free letter; use C on a floppy-only machine if desired.
[FILESYSTEM]
DRIVE=E
SHARE=FILES
READONLY=ON
TIMEOUT=30
[ISO]
ENABLED=OFF
