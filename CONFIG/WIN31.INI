; LiteLink Windows example for Win11 and Win3.1. Edit paths and bind address.
; 0.0.14 Windows 3.1/Win32s runtime is currently unverified.
[NETWORK]
TIMEOUT=60
BLOCKSIZE=256
[HOST]
BIND=0.0.0.0
PORT=21210
ROOT=C:\LITELINK\FILES
LOG=C:\LITELINK\LLHOST.LOG
; LLFS only: OFF permits a writable client mount. Restart after changes.
READONLY=ON
