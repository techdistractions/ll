; LiteLink example. Edit all addresses and the NIC base for your LAN.
[NETWORK]
NIC=NE2000
NICBASE=320
IRQ=3
MACFORMAT=AUTO
IP=192.168.0.20
NETMASK=255.255.255.0
GATEWAY=192.168.0.1
DNS=192.168.0.1
TIMEOUT=60
RETRIES=2
RETRYDELAY=3
BLOCKSIZE=256
[SHELL]
MODE=MANAGER
HOST=192.168.0.10
PORT=21210
ROOT=FILES
REQUEST=
[EXECUTION]
ALLOWRUN=OFF
JOBMEM=OFF
[TIME]
SERVER=time.cloudflare.com
PORT=123
; UTC by default. Set your current local offset in signed minutes before /SET.
UTCOFFSET=0
[GET]
MAXKB=16384
